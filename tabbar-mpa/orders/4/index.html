<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Плитка 4 — TabBar MPA</title>
<link rel="stylesheet" href="/tabbar-mpa/style.css">
<script>
// Блокирующий инлайн-скрипт: должен отработать ДО первой отрисовки,
// иначе будет видна вспышка финальной позиции перед стартом анимации.
(function () {
  try {
    var v = sessionStorage.getItem('tb_enter_anim');
    if (v === 'push' || v === 'pop') {
      document.documentElement.setAttribute('data-enter', v);
    }
  } catch (e) {}
})();
</script>
</head>
<body>
  <main id="screen-content">
    <div class="screen-dim"></div>
    <div class="screen-navbar">
      <a class="navbar-back" href="/tabbar-mpa/orders/" data-nav="pop"><svg viewBox="0 0 12 20"><path d="M10 1L2 10l8 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Назад</span></a>
      <div class="navbar-title">Плитка 4</div>
    </div>
    <div class="screen-body">
      <div class="page-heading">Плитка 4</div>
      <div class="page-sub">/tabbar-mpa/orders/4/</div>
      <div class="tile-grid">
        <div class="tile is-loading" style="background: linear-gradient(135deg, hsl(15 85% 62%), hsl(50 85% 42%));">
          <span class="tile-index">1</span>
          <span class="tile-label">Плитка 1</span>
          
          <span class="tile-skeleton"></span>
        </div>
        <div class="tile is-loading" style="background: linear-gradient(135deg, hsl(76 85% 62%), hsl(111 85% 42%));">
          <span class="tile-index">2</span>
          <span class="tile-label">Плитка 2</span>
          
          <span class="tile-skeleton"></span>
        </div>
        <div class="tile is-loading" style="background: linear-gradient(135deg, hsl(137 85% 62%), hsl(172 85% 42%));">
          <span class="tile-index">3</span>
          <span class="tile-label">Плитка 3</span>
          
          <span class="tile-skeleton"></span>
        </div>
        <div class="tile is-loading" style="background: linear-gradient(135deg, hsl(198 85% 62%), hsl(233 85% 42%));">
          <span class="tile-index">4</span>
          <span class="tile-label">Плитка 4</span>
          
          <span class="tile-skeleton"></span>
        </div>
        <div class="tile is-loading" style="background: linear-gradient(135deg, hsl(259 85% 62%), hsl(294 85% 42%));">
          <span class="tile-index">5</span>
          <span class="tile-label">Плитка 5</span>
          
          <span class="tile-skeleton"></span>
        </div>
        <div class="tile is-loading" style="background: linear-gradient(135deg, hsl(320 85% 62%), hsl(355 85% 42%));">
          <span class="tile-index">6</span>
          <span class="tile-label">Плитка 6</span>
          
          <span class="tile-skeleton"></span>
        </div>
      </div>
    </div>
  </main>

  <nav id="tabbar">
    <div id="tabbar-glass"></div>
    <div id="tabbar-items">
      <a class="tab-btn" href="/tabbar-mpa/home/"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5v-5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V20h3a1 1 0 0 0 1-1v-9"/></svg><span class="tab-label">Главная</span></a>
      <a class="tab-btn" href="/tabbar-mpa/catalog/"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg><span class="tab-label">Каталог</span></a>
      <a class="tab-btn" href="/tabbar-mpa/favorites/"><svg viewBox="0 0 24 24"><path d="M12 20.3S3.8 15.3 3.8 9.8C3.8 6.6 6 4.5 8.7 4.5c1.9 0 3.4 1.1 3.3 3-.1-1.9 1.4-3 3.3-3 2.7 0 4.9 2.1 4.9 5.3 0 5.5-8.2 10.5-8.2 10.5z"/></svg><span class="tab-label">Избранное</span></a>
      <a class="tab-btn active" href="/tabbar-mpa/orders/"><svg viewBox="0 0 24 24"><path d="M9 8.3V6.6a3 3 0 0 1 6 0V8.3"/><path d="M5.8 8.3h12.4l-1.1 11a1.6 1.6 0 0 1-1.6 1.4H8.5a1.6 1.6 0 0 1-1.6-1.4l-1.1-11z"/></svg><span class="tab-label">Заказы</span></a>
      <a class="tab-btn" href="/tabbar-mpa/profile/"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.3" r="3.6"/><path d="M4.5 20c1.3-4 4-6 7.5-6s6.2 2 7.5 6"/></svg><span class="tab-label">Профиль</span></a>
    </div>
  </nav>

  <script src="/tabbar-mpa/skeleton.js" defer></script>
  <script src="/tabbar-mpa/page-transitions.js" defer></script>
</body>
</html>
